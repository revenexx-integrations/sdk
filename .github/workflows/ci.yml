name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  # The full pipeline on the newest supported Node. The suite alone runs on the
  # older supported majors in `engines` below.
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `biome check src` — the linter only (see biome.json). Its reason for
      # existing is noRestrictedGlobals on `fetch`: this is the package that
      # defines safeFetch/assertPublicUrl, and PO-185 was a raw fetch here that
      # only a scanner in another repository caught. This step is the enforcement
      # point on the commit that writes the next one.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # The suite on the other Node majors `engines.node` claims (`>=20.3.0`), because
  # `test` above pins one. Its own job, and not a matrix on `test`, purely so the
  # check context stays `test` — a matrix renames it to `test (24)` and the live
  # ruleset (see docs/branch-protection.md) requires the old name, which would then
  # never report.
  #
  # This exists for the connect-time half of the SSRF guard. That half reads fields
  # off an undici diagnostics message, and the shape of that message is Node's to
  # change: on a Node whose undici renamed them the guard goes quiet, and
  # `specs/ssrf-guard.md` AC-17 is the canary that catches it. A canary that only
  # ever ran on one of three supported majors is not watching the other two.
  engines:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Not `npm test`, and the reason is Node 20: `node --test` only learned to
      # expand a glob itself in 21, and `npm test` keeps its pattern quoted so that
      # it also binds under `cmd.exe` (spec.config.json records why). On 20 the
      # quoted pattern is read as a literal filename and nothing is collected — not
      # a red suite, an empty one. Here the runner is bash, so the shell expands it
      # and every file is passed by name.
      - name: Test
        run: node --import tsx --test src/*.test.ts

  # The spec gate: every promise in specs/ bound to the test that proves it, in both
  # directions. Its own job on purpose — a spec failure has to read as a spec failure
  # and not as a red test. Needs no build: it reads the runner's own listing.
  #
  # That listing is a RUN here, because node:test has no --list mode: enumerating the
  # suite executes the claiming tests through scripts/spec-claims-reporter.mjs. So a
  # red proof takes the listing down with it and the gate reports coverage as unknown
  # rather than absent — the same failure surfaces twice, once in `test` and once here.
  spec:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check specs against tests
        run: npm run spec:check

  changeset:
    # Enforce that every PR carries a changeset (hard gate; add it as a required
    # status check in .github/rulesets/main.json). Use `npx changeset --empty`
    # for PRs that intentionally need no release (docs/CI/tests).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Require a changeset
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" = "changeset-release/main" ]; then
            echo "Version Packages PR — changesets are consumed here, skipping."
            exit 0
          fi
          git fetch origin main:refs/remotes/origin/main
          npx changeset status --since=origin/main
